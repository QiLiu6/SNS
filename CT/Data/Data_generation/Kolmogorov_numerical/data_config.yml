n_sims: 1               ## Number of training sims to run
n_traj: 1        ## Number of training trajectories per simulation, so the total number of trajectory is n_sims * trajectories
chunk_size: 10000        ## Number of simulation steps to process at once (reduce if still getting OOM)

nsteps: 100000               ## Number of Dt size step to save
dt: 0.001               ## Numerical timestep for jax_cfd
Dt: 0.002               ## Actually saved steps for training e.g. an emulator step
spinup: 10000           ## How many numerical timesteps to run before storing snapshots, also known as spinup phase
decorr_steps: 0      ## How many numerical timesteps to seperate training trajectories by.

reynolds: 10000         ## Reynolds number
gridsize: 512           ## Simulation gridsize
downsample: 8           ## Downsampling factor for emulator fields